[package]
name = "gharial"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Minimal window manager for the river Wayland compositor."

[[bin]]
name = "gharial"
path = "src/main.rs"

[dependencies]
gharial-ipc.workspace = true
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
calloop = "0.14"
calloop-wayland-source = "0.4"
# Required by wayland-scanner-generated code for bitfield enums.
bitflags = "2"
# Spawned-child reaping (SIGCHLD = SIG_IGN), nothing else.
libc = "0.2"

[dev-dependencies]
# xdg-shell bindings for the `testclient` example.
wayland-protocols = { version = "0.32", features = ["client"] }
